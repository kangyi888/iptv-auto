name: Cron Run PS1 Scripts
on:
  schedule:
    # UTC 09:00 / 22:00 → 北京时间 17:00 / 次日06:00
    - cron: '0 9,22 * * *'
  workflow_dispatch: # 支持手动触发测试

jobs:
  run-scripts:
    runs-on: windows-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 执行 script1.ps1（输出m3u）
        shell: pwsh
        run: |
          .\scripts\script1.ps1
          Write-Host "==== script1 执行完成，等待60秒 ===="
          Start-Sleep -Seconds 60

      - name: 执行 script2.ps1（输出m3u）
        shell: pwsh
        run: |
          .\scripts\script2.ps1
          Write-Host "==== script2 执行完成，等待60秒 ===="
          Start-Sleep -Seconds 60

      - name: 执行 script3.ps1（输出txt）
        shell: pwsh
        run: |
          .\scripts\script3.ps1
          Write-Host "==== script3 全部脚本执行完毕 ===="

      - name: 提交output文件回仓库
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git status
          git commit -m "Auto update output files [Cron Job]" || Write-Host "无文件变更，跳过提交"
          git push

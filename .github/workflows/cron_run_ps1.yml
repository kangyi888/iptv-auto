name: IPTV Auto Update
on:
  schedule:
    # 北京时间 06:00 → UTC 前一天22:00
    - cron: '0 22 * * *'
    # 北京时间 17:00 → UTC 09:00
    - cron: '0 9 * * *'
  workflow_dispatch: # 支持手动触发
jobs:
  run-iptv-scripts:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create output folder
        run: |
          if (!(Test-Path "output")){
            New-Item -ItemType Directory -Path "output" | Out-Null
          }
          if (!(Test-Path "output\.gitkeep")){
            New-Item -ItemType File -Path "output\.gitkeep" | Out-Null
          }
        shell: pwsh
      # ========== Script1 ==========
      - name: Run script1.ps1
        id: run_script1
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2       # 总共2次执行：首次 + 重试1次
          retry_wait_seconds: 5 # 重试前等待5秒
          shell: pwsh
          command: |
            Write-Host "==== Start script1.ps1 ===="
            .\scripts\script1.ps1
            Write-Host "==== script1.ps1 finished ===="
      - name: Wait 15s after script1
        if: success() || failure()
        run: Start-Sleep -Seconds 15
        shell: pwsh
      # ========== Script2 ==========
      - name: Run script2.ps1
        id: run_script2
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 5
          shell: pwsh
          command: |
            Write-Host "==== Start script2.ps1 ===="
            .\scripts\script2.ps1
            Write-Host "==== script2.ps1 finished ===="
      - name: Wait 15s after script2
        if: success() || failure()
        run: Start-Sleep -Seconds 15
        shell: pwsh
      # ========== Script3 ==========
      - name: Run script3.ps1
        id: run_script3
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 5
          shell: pwsh
          command: |
            Write-Host "==== Start script3.ps1 ===="
            .\scripts\script3.ps1
            Write-Host "==== script3.ps1 finished ===="
      # ==========【新增：检查M3U文件大小】==========
      - name: Check output m3u file size
        if: success() || failure()
        run: |
          Write-Host "`n===== 输出目录M3U文件大小清单 ====="
          Get-ChildItem output\*.m3u -ErrorAction SilentlyContinue | Select-Object Name,Length
        shell: pwsh
      # ========== 汇总日志：控制台打印 + 写入 output/run_summary.txt ==========
      - name: Print & Save execution summary
        if: success() || failure()
        run: |
          $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          $s1 = "${{ steps.run_script1.outcome }}"
          $s2 = "${{ steps.run_script2.outcome }}"
          $s3 = "${{ steps.run_script3.outcome }}"
          $content = @(
            "=====================================",
            "           IPTV 任务执行汇总          ",
            "执行时间: $time",
            "=====================================",
            "script1.ps1 : $s1",
            "script2.ps1 : $s2",
            "script3.ps1 : $s3",
            "=====================================",
            ""
          )
          # 控制台输出
          $content | Write-Host
          # 写入文件，UTF8，Windows用反斜杠
          $content | Out-File "output\run_summary.txt" -Encoding UTF8
        shell: pwsh
      # ========== 提交文件回仓库 ==========
      - name: Commit and push output files
        if: success() || failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git status
          git commit -m "Auto update IPTV output files [GitHub Actions]" || Write-Host "No changes to commit"
          git push
        shell: pwsh

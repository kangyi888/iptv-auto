name: IPTV Auto Update
on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = 北京时间次日 05:00
    - cron: '0 2 * * *'   # UTC 02:00 = 北京时间 10:00
    - cron: '0 8 * * *'   # UTC 08:00 = 北京时间 16:00
  workflow_dispatch: # 支持手动触发

jobs:
  run-iptv-scripts:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run script1.ps1
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          shell: pwsh
          command: |
            .\scripts\script1.ps1

      - name: Run script2.ps1
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          shell: pwsh
          command: |
            .\scripts\script2.ps1

      - name: Run script3.ps1
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          shell: pwsh
          command: |
            .\scripts\script3.ps1

      - name: Check output file list
        run: |
          Get-ChildItem .\output\
        shell: pwsh

      - name: Commit and push output files
        if: success() || failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm --cached output/* -r -f 2>&1 | Out-Null
          git add output/ --force
          git status
          git commit -m "Auto update IPTV output files [GitHub Actions]" || Write-Host "No changes detected, skip commit"
          git push
        shell: pwsh
